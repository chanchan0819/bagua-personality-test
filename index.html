<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" href="data:," />
    <title>八卦人格测试</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&family=Noto+Serif+SC:wght@400;600;900&display=swap" rel="stylesheet" />
    <style>
      button, [role="button"], select, summary, input:not([type="checkbox"], [type="radio"]) { min-height: 2rem; }
    </style>
    <style>
      :root {
        --paper: #f6f0e0;
        --paper-2: #efe6cd;
        --card: #fffdf4;
        --ink: #211d15;
        --ink-2: #5c5545;
        --ink-3: #8a8069;
        --accent: #a9341f;
        --accent-soft: #f3ddd2;
        --gold: #96762a;
        --line: #ddd2b2;
        --shadow: 0 10px 30px rgba(60, 48, 20, .12);
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --paper: #141311;
          --paper-2: #1b1a17;
          --card: #201e1a;
          --ink: #ece3cb;
          --ink-2: #b3a888;
          --ink-3: #7d7460;
          --accent: #e0653f;
          --accent-soft: #3a231b;
          --gold: #c9a44f;
          --line: #3a362b;
          --shadow: 0 10px 30px rgba(0, 0, 0, .45);
        }
      }
      * { box-sizing: border-box; }
      html { -webkit-text-size-adjust: 100%; }
      body {
        margin: 0;
        font-family: "Noto Serif SC", "Songti SC", serif;
        color: var(--ink);
        background:
          radial-gradient(ellipse 90% 40% at 50% -5%, var(--paper-2), transparent 70%),
          var(--paper);
        min-height: 100vh;
      }
      .wrap { max-width: 680px; margin: 0 auto; padding: 20px 18px 56px; }
      .screen { display: none; }
      .screen.active { display: block; animation: fadein .35s ease both; }
      @keyframes fadein { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
      @media (prefers-reduced-motion: reduce) {
        .screen.active { animation: none; }
        .bagua-ring { animation: none !important; }
        .taiji { animation: none !important; }
      }
      .brush { font-family: "Ma Shan Zheng", "Noto Serif SC", serif; font-weight: 400; }

      /* ---------- intro ---------- */
      .bagua-stage { position: relative; width: min(320px, 82vw); aspect-ratio: 1; margin: 8px auto 4px; }
      .bagua-ring { position: absolute; inset: 0; animation: spin 140s linear infinite; }
      @keyframes spin { to { transform: rotate(360deg); } }
      .bagua-ring .glyph {
        position: absolute; left: 50%; top: 50%; width: 40px; margin: -14px 0 0 -20px;
        display: flex; flex-direction: column; gap: 3.5px;
      }
      .bagua-ring .glyph i { display: flex; gap: 4px; height: 4.5px; }
      .bagua-ring .glyph i b { flex: 1; background: var(--ink); border-radius: 2px; }
      .bagua-ring .glyph.yin-mid i:nth-child(2) b { background: var(--accent); }
      .taiji-wrap { position: absolute; inset: 0; display: grid; place-items: center; }
      .taiji { width: 34%; height: 34%; animation: spin 60s linear infinite reverse; filter: drop-shadow(0 4px 10px rgba(0,0,0,.18)); }
      .intro-head { text-align: center; margin-top: 10px; }
      .intro-head h1 { font-size: clamp(44px, 13vw, 64px); margin: 0; letter-spacing: .06em; line-height: 1.15; }
      .intro-head .sub { color: var(--ink-2); font-size: 16px; margin: 10px 0 0; line-height: 1.8; }
      .intro-head .sub b { color: var(--accent); font-weight: 900; }
      .seal {
        display: inline-grid; place-items: center; width: 30px; height: 30px;
        background: var(--accent); color: #fdf6e3; border-radius: 5px;
        font-size: 17px; transform: rotate(-4deg); vertical-align: -8px; margin-right: 8px;
        box-shadow: 0 2px 6px rgba(0,0,0,.2);
      }
      .how {
        display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin: 26px 0 6px;
      }
      .how .cell {
        background: var(--card); border: 1px solid var(--line); border-radius: 10px;
        padding: 14px 10px 12px; text-align: center;
      }
      .how .cell .n { font-size: 22px; color: var(--accent); }
      .how .cell p { margin: 6px 0 0; font-size: 13px; color: var(--ink-2); line-height: 1.6; }
      .btn {
        font-family: inherit; cursor: pointer; border: none; border-radius: 10px;
        font-size: 17px; font-weight: 600; letter-spacing: .08em;
        padding: 14px 28px; min-height: 52px;
        transition: transform .12s ease, background .15s ease, border-color .15s ease;
      }
      .btn:active { transform: scale(.97); }
      .btn-primary { background: var(--accent); color: #fdf6e3; box-shadow: var(--shadow); width: 100%; margin-top: 22px; }
      .btn-ghost { background: transparent; color: var(--ink-2); border: 1px solid var(--line); }
      .btn-ghost:hover { border-color: var(--accent); color: var(--accent); }
      .fineprint { text-align: center; color: var(--ink-3); font-size: 12.5px; line-height: 1.8; margin-top: 16px; }
      .intro-types { margin-top: 30px; }
      .intro-types h2, .sec-title { font-size: 19px; margin: 0 0 4px; display: flex; align-items: center; gap: 8px; }
      .sec-title::before { content: ""; width: 9px; height: 9px; background: var(--accent); border-radius: 2px; transform: rotate(45deg); flex: none; }
      .intro-types .hint, .sec-sub { color: var(--ink-3); font-size: 13px; margin: 0 0 14px; }

      /* ---------- trigram glyph ---------- */
      .tri { display: flex; flex-direction: column; }
      .tri .yao { display: flex; }
      .tri .yao b { background: currentColor; border-radius: 99px; }
      .tri.md { gap: 7px; width: 92px; color: var(--ink); }
      .tri.md .yao { gap: 12px; height: 13px; }
      .tri.md .yao b { flex: 1; }
      .tri.lg { gap: 10px; width: 132px; color: var(--ink); }
      .tri.lg .yao { gap: 16px; height: 17px; }
      .tri.lg .yao b { flex: 1; }
      .tri.sm { gap: 3.5px; width: 40px; }
      .tri.sm .yao { gap: 5px; height: 5px; }
      .tri.sm .yao b { flex: 1; }

      /* ---------- quiz ---------- */
      .quiz-top { display: flex; align-items: baseline; justify-content: space-between; margin-top: 6px; }
      .quiz-count { font-size: 14px; color: var(--ink-2); letter-spacing: .1em; }
      .quiz-count b { color: var(--accent); font-size: 20px; }
      .quiz-axis { font-size: 13px; color: var(--ink-3); }
      .progress { height: 6px; background: var(--paper-2); border-radius: 99px; margin: 10px 0 30px; overflow: hidden; }
      .progress i { display: block; height: 100%; background: var(--accent); border-radius: 99px; transition: width .3s ease; }
      .q-text { font-size: clamp(21px, 5.6vw, 26px); font-weight: 900; line-height: 1.55; margin: 0 0 24px; min-height: 2.6em; }
      .opt {
        display: flex; gap: 14px; align-items: flex-start; width: 100%; text-align: left;
        background: var(--card); border: 1.5px solid var(--line); border-radius: 12px;
        padding: 18px 16px; margin-bottom: 14px; cursor: pointer; font-family: inherit;
        font-size: 16.5px; line-height: 1.65; color: var(--ink); min-height: 60px;
        transition: border-color .15s ease, background .15s ease, transform .1s ease;
      }
      .opt:hover { border-color: var(--gold); }
      .opt .mark {
        flex: none; width: 30px; height: 30px; border-radius: 50%; border: 1.5px solid var(--line);
        display: grid; place-items: center; font-size: 14px; color: var(--ink-2); margin-top: 1px;
      }
      .opt.picked { border-color: var(--accent); background: var(--accent-soft); }
      .opt.picked .mark { background: var(--accent); border-color: var(--accent); color: #fdf6e3; }
      .quiz-nav { display: flex; justify-content: space-between; margin-top: 8px; }
      .link-btn { background: none; border: none; color: var(--ink-3); font-family: inherit; font-size: 14.5px; cursor: pointer; padding: 10px 6px; min-height: 44px; }
      .link-btn:hover { color: var(--accent); }
      .link-btn[disabled] { opacity: .35; pointer-events: none; }

      /* ---------- result ---------- */
      .result-hero { text-align: center; padding-top: 8px; }
      .result-hero .tri { margin: 14px auto 6px; }
      .result-hero .gua-name { color: var(--ink-2); font-size: 15px; letter-spacing: .35em; margin: 8px 0 0; text-indent: .35em; }
      .result-hero h2 { font-size: clamp(46px, 13vw, 62px); margin: 2px 0 0; line-height: 1.2; }
      .result-hero .epithet-sub { font-size: 18px; color: var(--accent); font-weight: 900; margin: 8px 0 0; }
      .tag-row { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin: 16px 0 4px; }
      .tag { border: 1px solid var(--line); background: var(--card); color: var(--ink-2); border-radius: 99px; padding: 5px 13px; font-size: 13.5px; }
      .tag.hot { border-color: var(--accent); color: var(--accent); }
      .quote-box {
        margin: 22px 0 6px; padding: 18px 20px; background: var(--card);
        border: 1px solid var(--line); border-radius: 12px; text-align: center;
      }
      .quote-box .q { font-size: 19px; font-weight: 900; line-height: 1.7; margin: 0; }
      .quote-box .from { color: var(--ink-3); font-size: 12.5px; margin: 6px 0 0; }
      .card {
        background: var(--card); border: 1px solid var(--line); border-radius: 12px;
        padding: 20px; margin-top: 16px;
      }
      .card h3 { margin: 0 0 12px; font-size: 17px; display: flex; align-items: center; gap: 8px; }
      .card h3::before { content: ""; width: 8px; height: 8px; background: var(--accent); border-radius: 2px; transform: rotate(45deg); flex: none; }
      .card p { margin: 0; line-height: 1.95; font-size: 15.5px; color: var(--ink); }
      .card p + p { margin-top: 10px; }
      .yao-row { display: flex; align-items: center; gap: 14px; padding: 11px 0; border-bottom: 1px dashed var(--line); }
      .yao-row:last-child { border-bottom: none; padding-bottom: 2px; }
      .yao-row .pos { flex: none; width: 44px; color: var(--ink-3); font-size: 13px; letter-spacing: .1em; }
      .yao-row .one { flex: none; width: 52px; display: flex; gap: 7px; height: 10px; color: var(--ink); }
      .yao-row .one b { flex: 1; background: currentColor; border-radius: 99px; }
      .yao-row .pole { flex: none; font-weight: 900; font-size: 17px; width: 52px; }
      .yao-row .pole.yang { color: var(--accent); }
      .yao-row .desc { flex: 1; color: var(--ink-2); font-size: 13.5px; line-height: 1.6; }
      .yao-row .pct { flex: none; color: var(--ink-3); font-size: 13px; width: 40px; text-align: right; }
      .two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
      @media (max-width: 560px) { .two-col { grid-template-columns: 1fr; } .how { grid-template-columns: 1fr 1fr 1fr; gap: 8px; } .how .cell p { font-size: 12px; } }
      .list-clean { margin: 0; padding: 0; list-style: none; }
      .list-clean li { line-height: 1.85; font-size: 15px; padding-left: 18px; position: relative; margin-bottom: 6px; }
      .list-clean li::before { content: ""; position: absolute; left: 0; top: .62em; width: 7px; height: 7px; border-radius: 50%; background: var(--gold); }
      .list-clean.warn li::before { background: var(--accent); }
      .result-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 22px; }
      .result-actions .btn { margin-top: 0; width: 100%; }
      .result-actions .full { grid-column: 1 / -1; }
      @media (max-width: 480px) { .result-actions { grid-template-columns: 1fr; } }

      /* ---------- atlas ---------- */
      .atlas-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
      @media (max-width: 560px) { .atlas-grid { grid-template-columns: 1fr; } }
      .gua-card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 16px; }
      .gua-card .head { display: flex; align-items: center; gap: 14px; margin-bottom: 12px; }
      .gua-card .head .nm { font-size: 24px; font-weight: 900; }
      .gua-card .head .meta { color: var(--ink-3); font-size: 12.5px; line-height: 1.5; }
      .variant-btn {
        display: flex; justify-content: space-between; align-items: center; width: 100%;
        background: var(--paper); border: 1px solid var(--line); border-radius: 9px;
        padding: 11px 14px; margin-top: 8px; cursor: pointer; font-family: inherit; color: var(--ink);
        font-size: 15.5px; min-height: 48px; transition: border-color .15s ease;
      }
      .variant-btn:hover { border-color: var(--accent); }
      .variant-btn .vt { font-weight: 900; }
      .variant-btn .vd { color: var(--ink-3); font-size: 12.5px; }
      .variant-btn.mine { border-color: var(--accent); background: var(--accent-soft); }
      .toast {
        position: fixed; left: 50%; bottom: 28px; transform: translateX(-50%) translateY(20px);
        background: var(--ink); color: var(--paper); padding: 11px 22px; border-radius: 99px;
        font-size: 14.5px; opacity: 0; pointer-events: none; transition: all .25s ease; z-index: 50;
        box-shadow: var(--shadow); white-space: nowrap;
      }
      .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
    </style>
  </head>
  <body>
    <main class="wrap">

      <!-- ======== 介绍页 ======== -->
      <section class="screen active" id="screen-intro">
        <div class="bagua-stage" aria-hidden="true">
          <div class="bagua-ring" id="bagua-ring"></div>
          <div class="taiji-wrap">
            <svg class="taiji" viewBox="0 0 100 100" role="img" aria-label="太极图">
              <circle cx="50" cy="50" r="48" fill="var(--ink)"/>
              <path d="M50 2 A48 48 0 0 1 50 98 A24 24 0 0 1 50 50 A24 24 0 0 0 50 2 Z" fill="var(--paper)"/>
              <circle cx="50" cy="26" r="6.5" fill="var(--paper)"/>
              <circle cx="50" cy="74" r="6.5" fill="var(--ink)"/>
            </svg>
          </div>
        </div>
        <div class="intro-head">
          <h1 class="brush"><span class="seal">卦</span>八卦人格</h1>
          <p class="sub">乾坤震巽，坎离艮兑——八卦不止能占卜，也能照见性格。<br />20 道题，测出你的<b>本命卦</b>与<b>阴阳两型</b>，共 16 型。</p>
        </div>
        <div class="how">
          <div class="cell"><div class="n brush">动静</div><p>定下爻<br />你的能量底色</p></div>
          <div class="cell"><div class="n brush">刚柔</div><p>定中爻<br />你的处世方式</p></div>
          <div class="cell"><div class="n brush">明晦</div><p>定上爻<br />你的外在呈现</p></div>
        </div>
        <p class="fineprint" style="margin-top:10px;">三爻成卦，再以「乘势 / 守时」分出阴阳两型——如乾卦有乘风而起的「飞龙」，也有蓄势待发的「潜龙」。</p>
        <button class="btn btn-primary" id="btn-start">开始测试</button>
        <button class="btn btn-ghost" id="btn-atlas-intro" style="width:100%; margin-top:12px;">先看十六型图鉴</button>
        <p class="fineprint">本测试取材《周易》八卦意象，为传统文化娱乐向性格探索，<br />结果仅供参考，图个照见自己。</p>
      </section>

      <!-- ======== 答题页 ======== -->
      <section class="screen" id="screen-quiz">
        <div class="quiz-top">
          <div class="quiz-count">第 <b id="q-num">1</b> / 20 题</div>
          <div class="quiz-axis" id="q-axis"></div>
        </div>
        <div class="progress"><i id="q-bar" style="width:5%"></i></div>
        <p class="q-text" id="q-text"></p>
        <div id="q-opts"></div>
        <div class="quiz-nav">
          <button class="link-btn" id="btn-prev" disabled>← 上一题</button>
          <button class="link-btn" id="btn-quit">退出重来</button>
        </div>
      </section>

      <!-- ======== 结果页 ======== -->
      <section class="screen" id="screen-result">
        <div id="result-body"></div>
        <div class="result-actions">
          <button class="btn btn-primary" id="btn-copy">复制我的结果</button>
          <button class="btn btn-ghost" id="btn-atlas-result">十六型图鉴</button>
          <button class="btn btn-ghost full" id="btn-retake">重新测试</button>
        </div>
      </section>

      <!-- ======== 图鉴页 ======== -->
      <section class="screen" id="screen-atlas">
        <h2 class="sec-title brush" style="font-size:26px;">十六型图鉴</h2>
        <p class="sec-sub">八卦各分阴阳两型。点开任意一型，看它的完整解读。</p>
        <div class="atlas-grid" id="atlas-grid"></div>
        <button class="btn btn-ghost" id="btn-atlas-back" style="width:100%; margin-top:20px;">返回</button>
      </section>

      <!-- ======== 图鉴详情页 ======== -->
      <section class="screen" id="screen-detail">
        <div id="detail-body"></div>
        <div class="result-actions">
          <button class="btn btn-ghost" id="btn-detail-back">返回图鉴</button>
          <button class="btn btn-primary" id="btn-detail-test">测测我是哪一型</button>
        </div>
      </section>

    </main>
    <div class="toast" id="toast">已复制，去分享给朋友吧</div>

    <script>
    /* ================= 数据 ================= */
    // 四个维度：前三维定三爻（下→上），第四维定阴阳变体。v:1=阳面 0=阴面
    var AXES = [
      { name: "动静", pos: "下爻", yang: "动", yin: "静",
        yangDesc: "能量向外生发——先动起来，局面在行动中打开",
        yinDesc: "能量向内收敛——想清楚再动，不打无准备之仗" },
      { name: "刚柔", pos: "中爻", yang: "刚", yin: "柔",
        yangDesc: "处世果断直接——对事不对人，快刀斩乱麻",
        yinDesc: "处世灵活包容——以柔克刚，四两拨千斤" },
      { name: "明晦", pos: "上爻", yang: "明", yin: "晦",
        yangDesc: "锋芒外放——坦坦荡荡，喜怒都写在脸上",
        yinDesc: "含光内敛——深藏不露，心里有数就行" },
      { name: "乘守", pos: "变体", yang: "乘势", yin: "守时",
        yangDesc: "时机一到便乘势而起，边做边学",
        yinDesc: "时机未到便潜藏蓄势，静待属于自己的那一局" }
    ];

    var QUESTIONS = [
      { a: 0, q: "周末终于空出一整天，你更想怎么过？", o: [ ["约上朋友出门，热闹地玩一天", 1], ["关掉消息，一个人慢慢充电", 0] ] },
      { a: 1, q: "和朋友意见不合时，你更倾向于？", o: [ ["先听对方说完，找个折中的办法", 0], ["直接说出自己的想法，对就是对", 1] ] },
      { a: 2, q: "取得了一个不错的成绩，你会？", o: [ ["大方分享出来，让大家都知道", 1], ["自己开心就好，不太声张", 0] ] },
      { a: 3, q: "一个看起来不错的机会出现，但你还没完全准备好，你会？", o: [ ["先抓住，边做边学", 1], ["等准备充分了再出手", 0] ] },
      { a: 0, q: "团队里有个新任务没人接，你通常会？", o: [ ["先看看情况再决定", 0], ["先揽下来再说", 1] ] },
      { a: 1, q: "做重要决定时，你更相信？", o: [ ["事实和逻辑，该怎样就怎样", 1], ["感觉和关系，别伤了和气", 0] ] },
      { a: 2, q: "心里有情绪时，身边的人通常？", o: [ ["很难察觉，我藏得比较好", 0], ["一眼就能看出来", 1] ] },
      { a: 3, q: "对于「计划」，你的态度更接近？", o: [ ["有计划心里才踏实", 0], ["计划赶不上变化，随机应变才有意思", 1] ] },
      { a: 0, q: "脑子里冒出一个新想法，你的第一反应是？", o: [ ["立刻动手试试看", 1], ["先在心里盘一盘再说", 0] ] },
      { a: 1, q: "遇到明显不公平的事，你通常会？", o: [ ["当场指出来", 1], ["先忍一忍，看时机再处理", 0] ] },
      { a: 2, q: "在社交场合里，你更像？", o: [ ["安静的角落，自在旁观", 0], ["气氛中心，存在感很强", 1] ] },
      { a: 3, q: "你更喜欢哪种生活状态？", o: [ ["总有新东西在发生", 1], ["稳定、有规律、可预期", 0] ] },
      { a: 0, q: "到了一个陌生的聚会，你更可能？", o: [ ["先观察，找到合拍的人再聊", 0], ["主动找人聊起来", 1] ] },
      { a: 1, q: "别人做事拖拉影响到了你，你会？", o: [ ["委婉提醒，帮他一起想办法", 0], ["直接催，明确给个期限", 1] ] },

return v === 1
? '<div class="yao"><b></b></div>'
: '<div class="yao"><b></b><b></b></div>';
}).join("");

return v === 1? "<i><b></b></i>": "<i><b></b><b></b></i>";
}).join("");
html += '<div class="glyph" style="transform: rotate(' + angle + "deg) translateY(-" +

});
ring.innerHTML = html;

cur = 0; answers = [];
show("screen-quiz");
renderQ();
}
function renderQ() {
var item = QUESTIONS[cur];
$("q-num").textContent = cur + 1;
$("q-bar").style.width = ((cur + 1) / QUESTIONS.length * 100) + "%";
$("q-axis").textContent = "测「" + AXES[item.a].name + "」";
$("q-text").textContent = item.q;
$("btn-prev").disabled = cur === 0;
var marks = ["甲", "乙"];
$("q-opts").innerHTML = item.o.map(function (opt, i) {
return '<button class="opt" data-i="' + i + '"><span class="mark">' + marks[i] +
"</span><span>" + opt[0] + "</span></button>";
}).join("");
var btns = $("q-opts").querySelectorAll(".opt");
btns.forEach(function (btn) {
btn.addEventListener("click", function () {
btns.forEach(function (b) { b.classList.remove("picked");});
btn.classList.add("picked");
answers[cur] = item.o[Number(btn.getAttribute("data-i"))][1];
setTimeout(function () {
if (cur < QUESTIONS.length - 1) { cur++; renderQ();}
else { finish();}
}, 240);
});
});
}
function finish() {
var sums = [0, 0, 0, 0], counts = [0, 0, 0, 0];
QUESTIONS.forEach(function (item, i) { sums[item.a] += answers[i]; counts[item.a]++;});
var pcts = sums.map(function (s, i) { return Math.round(s / counts[i] * 100);});
var lines = [0, 1, 2].map(function (a) { return pcts[a] >= 50? 1: 0;});
var key = lines.join("");
var variant = pcts[3] >= 50? "yang": "yin";
myResult = { key: key, variant: variant, pcts: pcts, lines: lines};
$("result-body").innerHTML = resultHTML(key, variant, pcts, true);
show("screen-result");
}

/* ---------- 结果 / 详情渲染 ---------- */
function resultHTML(key, variant, pcts, isMine) {
var g = GUA[key], v = g[variant];
var tags = ['<span class="tag hot">' + v.epi + " · " + g.name + '卦</span>',
'<span class="tag">' + g.nature + "象</span>",
'<span class="tag">五行属' + g.wuxing + "</span>",
'<span class="tag">' + g.trait + "</span>"]
.concat(v.kw.map(function (k) { return '<span class="tag">' + k + "</span>";})).join("");
var yaoRows = "";
if (isMine && pcts) {
yaoRows = [0, 1, 2, 3].map(function (a) {
var ax = AXES[a];
var isYang = a < 3? (pcts[a] >= 50): (variant === "yang");
var pole = isYang? ax.yang: ax.yin;
var pct = isYang? pcts[a]: 100 - pcts[a];
var line = a < 3? oneYao(isYang? 1: 0)
: '<div class="one" style="color:var(--accent)"><b></b></div>';
return '<div class="yao-row"><span class="pos">' + ax.pos + " · " + ax.name + "</span>" +
line + '<span class="pole' + (isYang? " yang": "") + '">' + pole + "</span>" +
'<span class="desc">' + (isYang? ax.yangDesc: ax.yinDesc) + "</span>" +
'<span class="pct">' + pct + "%</span></div>";
}).join("");
}
return '' +
'<div class="result-hero">' +
(isMine? '<p class="gua-name" style="letter-spacing:.2em;">你的本命卦是</p>': "") +
triHTML(g.lines, "lg") +
'<p class="gua-name">' + g.name + " 卦 · " + g.nature + " 象</p>" +
'<h2 class="brush">' + v.epi + "</h2>" +
'<p class="epithet-sub">' + v.title + "</p>" +
'<div class="tag-row">' + tags + "</div>" +
"</div>" +
'<div class="quote-box"><p class="q">「' + g.quote + '」</p><p class="from">' + g.from + "</p></div>" +
(yaoRows? '<div class="card"><h3>你的三爻</h3>' + yaoRows + "</div>": "") +
'<div class="card"><h3>性格画像</h3><p>' + v.portrait + "</p></div>" +
'<div class="two-col">' +
'<div class="card"><h3>你的天赋</h3><ul class="list-clean">' +
v.gifts.map(function (x) { return "<li>" + x + "</li>";}).join("") + "</ul></div>" +
'<div class="card"><h3>你的功课</h3><ul class="list-clean warn">' +
v.lessons.map(function (x) { return "<li>" + x + "</li>";}).join("") + "</ul></div>" +
"</div>" +
'<div class="card"><h3>适合的方向</h3><p>' + v.fit + "</p></div>" +
'<div class="card"><h3>相处之道</h3><p>' + v.social + "</p></div>";
}

/* ---------- 图鉴 ---------- */
function renderAtlas() {
$("atlas-grid").innerHTML = GUA_ORDER.map(function (key) {
var g = GUA[key];
var btns = ["yang", "yin"].map(function (vv) {
var v = g[vv];
var mine = myResult && myResult.key === key && myResult.variant === vv;
return '<button class="variant-btn' + (mine? " mine": "") + '" data-key="' + key + '" data-v="' + vv + '">' +
'<span class="vt">' + v.epi + " · " + (vv === "yang"? "乘势型": "守时型") + "</span>" +
'<span class="vd">' + (mine? "← 你的结果": v.title) + "</span></button>";
}).join("");
return '<div class="gua-card"><div class="head">' + triHTML(g.lines, "sm") +
'<div><div class="nm">' + g.name + '卦</div><div class="meta">' + g.nature + "象 · 五行属" + g.wuxing + " · " + g.trait + "</div></div></div>" +
btns + "</div>";
}).join("");
$("atlas-grid").querySelectorAll(".variant-btn").forEach(function (btn) {
btn.addEventListener("click", function () {
$("detail-body").innerHTML = resultHTML(btn.getAttribute("data-key"), btn.getAttribute("data-v"), null, false);
show("screen-detail");
});
});
}

/* ---------- 复制结果 ---------- */
function toast(msg) {
var t = $("toast");
t.textContent = msg;
t.classList.add("show");
setTimeout(function () { t.classList.remove("show");}, 2200);
}
function copyResult() {
if (!myResult) return;
var g = GUA[myResult.key], v = g[myResult.variant];
var text = "我的八卦人格是——" + v.title + "。" +
"三爻：" + [0, 1, 2].map(function (a) {
return AXES[a].pos + (myResult.pcts[a] >= 50? AXES[a].yang: AXES[a].yin);
}).join("、") + "，气质" + (myResult.variant === "yang"? "乘势": "守时") + "。" +
"「" + g.quote + "」你是哪一卦？来测测你的本命卦。";
function done() { toast("已复制，去分享给朋友吧");}
if (navigator.clipboard && navigator.clipboard.writeText) {
navigator.clipboard.writeText(text).then(done, function () { fallback();});
} else { fallback();}
function fallback() {
var ta = document.createElement("textarea");
ta.value = text; ta.style.position = "fixed"; ta.style.opacity = "0";
document.body.appendChild(ta); ta.select();
try { document.execCommand("copy"); done();} catch (e) { toast("复制失败，长按结果页截图分享吧");}
document.body.removeChild(ta);
}
}

/* ---------- 事件绑定 ---------- */
$("btn-start").addEventListener("click", startQuiz);
$("btn-prev").addEventListener("click", function () { if (cur > 0) { cur--; renderQ();}});
$("btn-quit").addEventListener("click", function () { show("screen-intro");});
$("btn-retake").addEventListener("click", startQuiz);
$("btn-copy").addEventListener("click", copyResult);
$("btn-atlas-intro").addEventListener("click", function () { atlasReturn = "screen-intro"; renderAtlas(); show("screen-atlas");});
$("btn-atlas-result").addEventListener("click", function () { atlasReturn = "screen-result"; renderAtlas(); show("screen-atlas");});
$("btn-atlas-back").addEventListener("click", function () { show(atlasReturn);});
$("btn-detail-back").addEventListener("click", function () { show("screen-atlas");});
$("btn-detail-test").addEventListener("click", startQuiz);
</script>
</body>
</html>
